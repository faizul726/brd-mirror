name: Create Release with Assets

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for the release'
        required: true
        default: 'v1.'

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest release metadata
        id: latest_release
        uses: octokit/request-action@v2.4.0
        with:
          route: GET /repos/QYCottage/BetterRenderDragon/releases/latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save release metadata
        run: |
          echo '${{ steps.latest_release.outputs.data }}' > release.json

      - name: Download assets and generate checksums
        id: assets
        run: |
          mkdir assets
          TAG=$(jq -r '.tag_name' release.json)

          echo "## Checksums" > checksums.md
          echo "" >> checksums.md
          echo "Generated on $(date -u '+%Y-%m-%d %H:%M UTC')" >> checksums.md
          echo "" >> checksums.md

          jq -r '.assets[].name' release.json | while read asset; do
            echo "Downloading $asset"
            curl -sSL "https://github.com/QYCottage/BetterRenderDragon/releases/download/$TAG/$asset" -o "assets/$asset"

            sha256=$(sha256sum "assets/$asset" | awk '{print $1}')
            echo "- **$asset**: \`$sha256\`" >> checksums.md
          done

          echo "CHECKSUMS<<EOF" >> $GITHUB_ENV
          cat checksums.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      #- name: Create release and upload assets
       # uses: softprops/action-gh-release@v2.4.2
        #with:
         # tag_name: ${{ inputs.version }}
          #name: ${{ inputs.version }}
          #body: |
           # ${{ env.CHECKSUMS }}
          #files: assets/*
        #env:
         # GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         
      - name: Create release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.version }}" \
            assets/* \
            --title "${{ inputs.version }}" \
            --notes "${{ env.CHECKSUMS }}"

